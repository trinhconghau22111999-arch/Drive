plugins {
    id 'com.android.application'
}

android {
    namespace 'com.h.drive3'
    compileSdk 34

    defaultConfig {
        applicationId 'com.h.drive3'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
