plugins {
    id 'com.android.application'
}

android {
    namespace 'com.h.drive3'
    compileSdk 34

    defaultConfig {
        applicationId 'com.h.drive3'
        // Android 7.1.1 = API 25. App chỉ có mã Java (không có thư viện native)
        // nên cùng 1 file APK chạy được trên ARM 32/64-bit và x86/x86_64.
        minSdk 25
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        fixed {
            storeFile file('drive3.keystore')
            storePassword 'android'
            keyAlias 'drive3'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
